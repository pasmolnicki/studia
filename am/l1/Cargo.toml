[package]
name = "l1"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.0"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series"] }
csv = "1.4.0"
threadpool = "1.8.1"

[[bin]]
name = "l1"
path = "src/main.rs"
